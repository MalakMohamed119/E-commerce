<section class="brands-page">
    <div class="container mx-auto">
      <div class="page-heading">
        <span>Trusted names</span>
        <h2>All Brands</h2>
      </div>
      
      <div class="parent brands-grid">
        @for (brand of brandsList; track brand._id) {
          <div class="brand-card"
               (click)="onBrandClick(brand)">
            <div class="brand-image-wrap">
              <img 
                [src]="brand.image" 
                [alt]="brand.name"
                class="max-w-full max-h-full object-contain hover:scale-105 transition-transform duration-300"
                (error)="onImageError($event)"
              (load)="onImageLoad($event)">
            </div>
            <div class="brand-body">
              <h3>{{ brand.name }}</h3>
            </div>
          </div>
        }
      </div>
      
    </div>
  </section>

  <!-- Brand Modal -->
  @if (showModal && selectedBrand) {
    <div class="brand-modal fixed inset-0 flex items-center justify-center z-50"
         (click)="onOverlayClick($event)">
      <div class="brand-dialog bg-white rounded-lg shadow-2xl max-w-md w-full mx-4 transform transition-all">
        <div class="flex justify-between items-center p-6 border-b">
          <h3 class="text-2xl font-bold text-gray-800">{{ selectedBrand.name }}</h3>
          <button 
            (click)="closeModal()"
            class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        
        <div class="p-6">
          <div class="flex items-center justify-center mb-6 bg-transparent rounded-lg p-8">
            <img 
              [src]="selectedBrand.image" 
              [alt]="selectedBrand.name"
              class="max-w-full max-h-32 object-contain">
          </div>
          
          <div class="text-center">
            <h4 class="text-xl font-semibold text-gray-800">{{ selectedBrand.name }}</h4>
          </div>
        </div>
        
        <div class="px-6 py-4 bg-gray-50 rounded-b-lg">
          <button 
            (click)="closeModal()"
            class="w-full btn text-white py-2 px-4 rounded-lg transition-colors">
            Close
          </button>
        </div>
      </div>
    </div>
  }
