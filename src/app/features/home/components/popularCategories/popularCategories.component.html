<div class="categories-showcase">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="section-heading">
      <span>Curated departments</span>
      <h2>Shop Popular Categories</h2>
      <p>Move quickly through the shelves customers visit most.</p>
    </div>
    
    <div class="category-carousel relative">
      <div class="overflow-hidden select-none"
           (touchstart)="onTouchStart($event)"
           (touchmove)="onTouchMove($event)"
           (touchend)="onTouchEnd()"
           (mousedown)="onMouseDown($event)"
           (mousemove)="onMouseMove($event)"
           (mouseup)="onMouseUp()"
           (mouseleave)="onMouseLeave()">
           
        <div 
          #carouselContainer
          class="grid gap-5 transition-transform duration-300"
          [style.gridTemplateColumns]="getGridTemplateColumns()"
          [style.transform]="getTransform()"
          [style.gridAutoFlow]="'column'"
          [style.gridAutoColumns]="getGridAutoColumns()"
          [style.touchAction]="isDragging ? 'none' : 'auto'"
          [style.cursor]="isDragging ? 'grabbing' : 'grab'"
          [style.userSelect]="'none'"
          [style.WebkitUserSelect]="'none'">
          
          @for (category of categoriesList.concat(categoriesList); track $index) {
            <div class="category-item group">
              <div class="category-image">
                <img 
                  [src]="category.image" 
                  [alt]="category.name" 
                  class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                  (error)="onImageError($event)"
                  (load)="onImageLoad($event)">
              </div>
              <h3>{{ category.name }}</h3>
            </div>
          }
        </div>
      </div>
      
      <div class="category-dots">
        @for (dot of getVisibleDots(); track $index) {
          <button
            (click)="goToSlide($index * itemsPerView)"
            [class.active]="currentIndex >= $index * itemsPerView && currentIndex < ($index + 1) * itemsPerView"
            [attr.aria-label]="'Go to slide ' + ($index + 1)">
          </button>
        }
      </div>
    </div>
  </div>
</div>
