<section class="catalog-page">
    <div class="container mx-auto">
      <div class="catalog-header">
        <span>Explore the store</span>
        <h2>Our Products</h2>
      </div>
      @if (productList.length > 0) {
        <div class="parent catalog-grid">
          @for (product of productList | paginate: { 
            id: 'foo',
            itemsPerPage: p,
            currentPage: p,
            totalItems: total 
          }; track product.id) {
            <app-product-card 
              [product]="product" 
              [showButtonAlways]="true"
              [isInWishlist]="isInWishlist(product.id)"
              [isInCart]="isInCart(product.id)"
              (toggleWishlist)="onToggleWishlist($event)"
              (addToCart)="onAddToCart($event)">
            </app-product-card>
          }
        </div>
        <div class="flex justify-center mt-20 text-2xl mb-0">
          <pagination-controls  
            id="some_id"
            (pageChange)="getAllProductsData($event)">
          </pagination-controls>
        </div>
      } @else {
        <div class="text-center py-12">
          <p class="text-gray-600">No products found.</p>
        </div>
      }
    </div>
  </section>
