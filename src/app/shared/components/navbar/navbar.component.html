<nav class="app-navbar mb-0">
  <div class="navbar-inner max-w-screen-2xl flex items-center justify-between mx-auto py-3 px-4 lg:px-8">

    <!-- Logo -->
    <div class="flex-shrink-0">
      <a routerLink="/" class="flex items-center gap-3" aria-label="EvoShop home">
        <span class="brand-mark">
          <i class="fas fa-bolt-lightning"></i>
        </span>
        <span class="brand-name">EvoShop</span>
      </a>
    </div>

    <!-- Nav Links (desktop) -->
    <ul class="nav-links hidden md:flex flex-row items-center" *ngIf="isAuthenticated">
      <li><a routerLink="/home" routerLinkActive="active-link">Home</a></li>
      <li><a routerLink="/products" routerLinkActive="active-link">Products</a></li>
      <li><a routerLink="/categories" routerLinkActive="active-link">Categories</a></li>
      <li><a routerLink="/brands" routerLinkActive="active-link">Brands</a></li>
      <li><a routerLink="/orders" routerLinkActive="active-link">Orders</a></li>

      <!-- Icon Buttons -->
      <li class="icon-group">
        <a routerLink="/wishlist" class="nav-icon-btn" routerLinkActive="active-link" title="Wishlist" aria-label="Wishlist">
          <i class="far fa-heart"></i>
          <span class="nav-badge badge-red" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
        </a>
        <a routerLink="/cart" class="nav-icon-btn" routerLinkActive="active-link" title="Cart" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="nav-badge badge-blue" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </a>
      </li>
    </ul>

    <!-- Right Side (desktop) -->
    <div class="nav-right hidden md:flex items-center gap-3" *ngIf="isAuthenticated">
      <a routerLink="/profile" class="nav-avatar" routerLinkActive="active-link" title="Profile" aria-label="Profile">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <div class="nav-divider"></div>
      <button (click)="signOut()" class="sign-out-btn">Sign out</button>
    </div>

    <!-- Auth Links (not logged in) -->
    <div class="hidden md:flex items-center gap-2" *ngIf="!isAuthenticated">
      <a routerLink="/login" routerLinkActive="active-link" class="sign-out-btn">Login</a>
      <a routerLink="/register" routerLinkActive="active-link" class="register-btn">Register</a>
    </div>

    <!-- Mobile Menu Button -->
    <button type="button" class="mobile-menu-button ml-auto md:hidden"
      [attr.aria-expanded]="isMobileMenuOpen"
      (click)="toggleMobileMenu()">
      <span class="sr-only">Open main menu</span>
      <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu w-full md:hidden" [class.hidden]="!isMobileMenuOpen" id="navbar-default">
    <ul class="flex flex-col mt-4 space-y-1 border-b border-white/10 pb-3 px-4" *ngIf="isAuthenticated">
      <li>
        <a routerLink="/home" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
      </li>
      <li>
        <a routerLink="/products" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-box"></i>
          <span>Products</span>
        </a>
      </li>
      <li>
        <a routerLink="/categories" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-tags"></i>
          <span>Categories</span>
        </a>
      </li>
      <li>
        <a routerLink="/brands" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-star"></i>
          <span>Brands</span>
        </a>
      </li>
      <li>
        <a routerLink="/orders" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-receipt"></i>
          <span>My Orders</span>
        </a>
      </li>
      <li>
        <a routerLink="/wishlist" routerLinkActive="active-link" class="mobile-link relative" (click)="closeMobileMenu()">
          <i class="far fa-heart text-red-400"></i>
          <span>Wishlist</span>
          <span class="mobile-badge badge-red" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/cart" routerLinkActive="active-link" class="mobile-link relative" (click)="closeMobileMenu()">
          <i class="fas fa-shopping-cart"></i>
          <span>My Cart</span>
          <span class="mobile-badge badge-blue" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/profile" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">
          <i class="fas fa-user-circle"></i>
          <span>My Profile</span>
        </a>
      </li>
    </ul>

    <ul class="flex flex-col mt-3 space-y-2 font-medium px-4" *ngIf="!isAuthenticated">
      <li><a routerLink="/login" routerLinkActive="active-link" class="mobile-link" (click)="closeMobileMenu()">Login</a></li>
      <li><a routerLink="/register" routerLinkActive="active-link" class="mobile-link mobile-cta" (click)="closeMobileMenu()">Register</a></li>
    </ul>

    <div class="mobile-signout px-4 pt-3" *ngIf="isAuthenticated">
      <button (click)="signOut()" class="mobile-link mobile-logout">
        <i class="fas fa-arrow-right-from-bracket"></i>
        <span>Sign out</span>
      </button>
    </div>
  </div>
</nav>
