<div class="py-12 bg-white">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-3">
    <h2 class="text-5xl mb-8 text-gray-700 text-center">Shop Popular Categories</h2>
    
    <!-- Custom Carousel -->
    <div class="relative">
      <!-- Carousel Container with Touch and Drag Support -->
      <div class="overflow-hidden select-none"
           (touchstart)="onTouchStart($event)"
           (touchmove)="onTouchMove($event)"
           (touchend)="onTouchEnd()"
           (mousedown)="onMouseDown($event)"
           (mousemove)="onMouseMove($event)"
           (mouseup)="onMouseUp()"
           (mouseleave)="onMouseLeave()">
           
        <div 
          #carouselContainer
          class="grid gap-5 transition-transform duration-300"
          [style.gridTemplateColumns]="getGridTemplateColumns()"
          [style.transform]="getTransform()"
          [style.gridAutoFlow]="'column'"
          [style.gridAutoColumns]="getGridAutoColumns()"
          [style.touchAction]="isDragging ? 'none' : 'auto'"
          [style.cursor]="isDragging ? 'grabbing' : 'grab'"
          [style.userSelect]="'none'"
          [style.WebkitUserSelect]="'none'">
          
          @for (category of categoriesList.concat(categoriesList); track $index) {
            <div class="p-2 group">
              <div class="relative overflow-hidden rounded-xl h-64 shadow-md hover:shadow-lg transition-all duration-300">
                <img 
                  [src]="category.image" 
                  [alt]="category.name" 
                  class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                  (error)="onImageError($event)"
                  (load)="onImageLoad($event)">
              </div>
              <h3 class="mt-4 text-lg font-semibold text-gray-800 text-center">{{ category.name }}</h3>
            </div>
          }
        </div>
      </div>
      
      <!-- Dots Navigation -->
      <div class="flex justify-center mt-6 space-x-1">
        @for (dot of getVisibleDots(); track $index) {
          <button
            (click)="goToSlide($index * itemsPerView)"
            [class.bg-gray-400]="currentIndex >= $index * itemsPerView && currentIndex < ($index + 1) * itemsPerView"
            class="w-3 h-3 rounded-full bg-gray-200 hover:bg-gray-300 transition-colors"
            [attr.aria-label]="'Go to slide ' + ($index + 1)">
          </button>
        }
      </div>
    </div>
  </div>
</div>
